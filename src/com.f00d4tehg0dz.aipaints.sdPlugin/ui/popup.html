<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Paints image</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #151515; }
    body { display: grid; place-items: center; }
    img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <img id="image" alt="Generated image">
  <script>
    const image = new URLSearchParams(window.location.search).get("image");
    if (image && /^data:image\/(?:png|jpeg|webp);base64,/i.test(image)) {
      document.getElementById("image").src = image;
    }
  </script>
</body>
</html>
