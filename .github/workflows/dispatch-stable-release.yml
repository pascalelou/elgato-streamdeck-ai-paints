name: Dispatch Stable Release

on:
  push:
    branches:
      - release/2.0.0

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch stable 2.0.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-release.yml --repo pascalelou/elgato-streamdeck-ai-paints --ref main -f version=2.0.0 -f prerelease=false
