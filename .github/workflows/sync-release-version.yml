name: Sync Release Version

on:
  push:
    branches:
      - release/2.0.0

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: release/2.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Synchronize package versions
        run: npm version 2.0.0 --no-git-tag-version --allow-same-version

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Versions already synchronized."
            exit 0
          fi
          git commit -m "chore: sync 2.0.0 package metadata"
          git push
